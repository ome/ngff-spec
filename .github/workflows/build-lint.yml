name: "Build and Lint Site"

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: build-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: extractions/setup-just@v4
      - run: just build
      - name: Ensure no unexpected encoded HTML in output
        run: |
          ! fgrep -R 'lt;blockquote' _build/html
      # TODO: htmlproofer would be nice to have, but currently generates a lot of noise
