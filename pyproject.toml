[project]
name = "ngff-spec"
dynamic = ["version"]
description = "Next-generation file format specification"
requires-python = ">=3.10"

dependencies = [
    "json-schema-for-humans",
    "json_with_comments",
    "jupyter-book==2.0.2",
    "jsonschema_markdown",
    "mystmd==1.6.3",
    "tomli",
]

[dependency-groups]
test = ["pytest", "jsonschema"]
lint = ["codespell", "prek"]
dev = [
  "rust-just",
  { include-group = "test" },
  { include-group = "lint" }
]

[tool.codespell]
ignore-regex = '\bComparin\b'
skip = ".git,references.bib,.venv,.tox,*.css,_build"
ignore-words-list = "commend,Fuchsia"
check-hidden = true

[tool.hatch.version]
path = "_version.py"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling>=1.8.0,<1.21.1"]
build-backend = "hatchling.build"
